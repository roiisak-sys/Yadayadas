[build]
  command = "npm run build"
  publish = "dist"

# The site was rebranded from YADAYADAS to STARDUST. The old domain stays
# attached as a domain alias, and every request to it is permanently (301)
# redirected to the same path on the new domain, so old links and search
# results keep working and pass over their ranking.
[[redirects]]
  from = "https://yadayadasmusic.com/*"
  to = "https://stardustbowie.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://yadayadasmusic.com/*"
  to = "https://stardustbowie.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.yadayadasmusic.com/*"
  to = "https://stardustbowie.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.yadayadasmusic.com/*"
  to = "https://stardustbowie.com/:splat"
  status = 301
  force = true
